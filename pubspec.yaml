name: hisab
description: "Group expense splitting and settle-up app."
publish_to: 'none'
version: 0.7.22+93

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation
  go_router: ^17.5.0
  back_button_interceptor: ^8.0.4

  # Localization
  easy_localization: ^3.0.8

  # Local storage
  shared_preferences: ^2.5.5
  # Stay on 10.x: 11 drops v9 cipher data unless users first ran a 10.x build.
  flutter_secure_storage: ^10.3.2

  # Local database
  powersync: ^2.4.0
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0

  # Collections & utilities
  collection: ^1.19.1

  # UI & animations
  flex_color_scheme: ^8.4.0
  flex_color_picker: ^3.8.0
  custom_sliding_segmented_control: ^1.8.5
  fl_chart: ^1.2.0
  flame: ^1.38.2

  # Date & currency
  intl: ^0.20.3

  # Receipt: camera + OCR (Tesseract Android / Vision iOS via MethodChannel)
  camera: ^0.12.1
  image_picker: ^1.2.3
  image_picker_android: ^0.8.13+23
  image_picker_platform_interface: ^2.11.1
  flutter_image_compress: ^2.5.1

  # Logging
  flutter_logging_service:
    git:
      url: https://github.com/Zyzto/siglat.git
      ref: v0.2.2

  # Settings (theme, formatting, and scanner preferences)
  flutter_settings_framework:
    git:
      url: https://github.com/Zyzto/edadat.git
      ref: v0.8.0
  # Safaeh is also pulled by Edadat; pin the same release directly because the
  # app uses its shared shell widgets throughout the UI.
  safaeh:
    git:
      url: https://github.com/Zyzto/Safaeh.git
      ref: v0.2.5

  # About (version, licenses)
  package_info_plus: ^10.2.1

  # Backup (file picker for export/import + full zip packages)
  file_picker: ^12.2.0
  archive: ^4.2.0
  currency_picker: ^2.0.22

  # Permissions
  permission_handler: ^13.0.2

  clipboard: ^3.0.14
  share_plus: ^13.3.0
  web: ^1.1.1

  # AI-agent E2E (debug only via MarionetteBinding)
  marionette_flutter: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  args: ^2.7.0
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  flutter_launcher_icons: ^0.14.4
  marionette_mcp: ^0.6.0

dependency_overrides:
  # Edadat 0.8.0 uses the hosted Safaeh constraint for pub.dev publishing;
  # the app consumes the newer tagged Safaeh release until it is published.
  safaeh:
    git:
      url: https://github.com/Zyzto/Safaeh.git
      ref: v0.2.5

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true  # App Store rejects icons with alpha
  web:
    generate: true
  image_path: "assets/Hisab.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/Hisab.png"

flutter:
  uses-material-design: true
  assets:
    - assets/Hisab.png
    - assets/translations/
    - assets/images/parallax/
    - assets/tessdata/eng.traineddata
    - assets/tessdata/ara.traineddata
