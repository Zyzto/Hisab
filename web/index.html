<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Group expense splitting and settle-up app.">

  <!-- iOS / PWA meta tags & icons -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0175C2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hisab">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hisab</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      min-width: 320px;
      min-height: 500px;
      margin: 0;
      background: #f7f4ef;
      color: #1c1917;
    }
    #hisab-boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      z-index: 9999;
      pointer-events: none;
    }
    #hisab-boot-splash .title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    #hisab-boot-splash .subtitle {
      font-size: 14px;
      opacity: 0.7;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background: #121212;
        color: #f5f5f4;
      }
    }
  </style>
</head>
<body>
  <!-- Visible while Flutter boots / OAuth returns — avoids a blank black screen on iOS. -->
  <div id="hisab-boot-splash" aria-live="polite">
    <div class="title">Hisab</div>
    <div class="subtitle" id="hisab-boot-splash-status">Loading…</div>
  </div>
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var hash = window.location.hash || "";
        if (params.has("code") || hash.indexOf("access_token") !== -1) {
          var el = document.getElementById("hisab-boot-splash-status");
          if (el) el.textContent = "Signing you in…";
        } else if (params.has("error") || hash.indexOf("error") !== -1) {
          var errEl = document.getElementById("hisab-boot-splash-status");
          if (errEl) errEl.textContent = "Sign-in issue — finishing…";
        }
      } catch (_) {}
      function removeBootSplash() {
        var splash = document.getElementById("hisab-boot-splash");
        if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
      }
      // Flutter dispatches this after the first frame; also time out so a stuck
      // boot cannot leave the splash covering the page forever.
      window.addEventListener("flutter-first-frame", removeBootSplash);
      setTimeout(removeBootSplash, 15000);
    })();
  </script>
  <!-- Firebase SDK: load async so the boot splash paints before gstatic download. -->
  <script>
    // Firebase config — placeholders replaced at build time (CI) or from dart_defines_online.json (debug).
    // Do not commit real values. See CONFIGURATION.md and dart_defines_online.example.json.
    const firebaseConfig = {
      apiKey: "__FIREBASE_API_KEY__",
      authDomain: "__FIREBASE_AUTH_DOMAIN__",
      projectId: "__FIREBASE_PROJECT_ID__",
      storageBucket: "__FIREBASE_STORAGE_BUCKET__",
      messagingSenderId: "__FIREBASE_MESSAGING_SENDER_ID__",
      appId: "__FIREBASE_APP_ID__",
    };

    function hasPlaceholderFirebaseConfig(config) {
      const values = Object.values(config);
      return values.some((v) => typeof v === "string" && (v.includes("YOUR_") || v.includes("__FIREBASE_")));
    }

    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement("script");
        s.src = src;
        s.async = true;
        s.onload = function () { resolve(); };
        s.onerror = function () { reject(new Error("Failed to load " + src)); };
        document.head.appendChild(s);
      });
    }

    // Resolved before Flutter bootstrap so firebase_messaging sees an initialized app.
    window.__hisabFirebaseReady = (function () {
      if (hasPlaceholderFirebaseConfig(firebaseConfig)) {
        console.warn(
          "[hisab] Firebase web config uses placeholders; web push notifications are disabled until real values are set."
        );
        return Promise.resolve();
      }
      return loadScript("https://www.gstatic.com/firebasejs/11.4.0/firebase-app-compat.js")
        .then(function () {
          return loadScript("https://www.gstatic.com/firebasejs/11.4.0/firebase-messaging-compat.js");
        })
        .then(function () {
          firebase.initializeApp(firebaseConfig);
        })
        .catch(function (err) {
          console.warn("[hisab] Firebase web SDK failed to load; push disabled.", err);
        });
    })();
  </script>

  <!-- PWA capability bridge (used by lib/core/pwa) + notification click routing -->
  <script>
    function handleNotificationClickUrl(targetUrl) {
      if (typeof targetUrl !== "string" || targetUrl.length === 0) return;

      // Same-origin route navigation for Flutter web app.
      if (window.location.pathname !== targetUrl) {
        window.location.assign(targetUrl);
      } else {
        // Already on target path; emit popstate for routers listening to history.
        window.dispatchEvent(new PopStateEvent("popstate"));
      }
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.addEventListener("message", (event) => {
        const data = event.data || {};
        if (data.type === "NOTIFICATION_CLICK" && typeof data.url === "string") {
          handleNotificationClickUrl(data.url);
        }
      });
    }

    (function () {
      let deferredPrompt = null;

      function isStandaloneDisplay() {
        try {
          if (window.matchMedia("(display-mode: standalone)").matches) return true;
          if (window.matchMedia("(display-mode: fullscreen)").matches) return true;
          if (window.matchMedia("(display-mode: minimal-ui)").matches) return true;
        } catch (_) {}
        return !!(navigator.standalone) ||
          (typeof document.referrer === "string" &&
            document.referrer.indexOf("android-app://") === 0);
      }

      function notifyChanged() {
        if (typeof window.hisabPwa.onChanged === "function") {
          try {
            window.hisabPwa.onChanged();
          } catch (_) {}
        }
      }

      window.hisabPwa = {
        canPrompt: false,
        isStandalone: isStandaloneDisplay(),
        onChanged: null,
        promptInstall: function () {
          if (!deferredPrompt) return Promise.resolve(false);
          var promptEvent = deferredPrompt;
          deferredPrompt = null;
          window.hisabPwa.canPrompt = false;
          notifyChanged();
          return promptEvent.prompt().then(function () {
            return promptEvent.userChoice;
          }).then(function (choice) {
            return !!(choice && choice.outcome === "accepted");
          }).catch(function () {
            return false;
          });
        },
      };

      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        deferredPrompt = e;
        window.hisabPwa.canPrompt = true;
        window.hisabPwa.isStandalone = isStandaloneDisplay();
        notifyChanged();
      });

      window.addEventListener("appinstalled", function () {
        deferredPrompt = null;
        window.hisabPwa.canPrompt = false;
        window.hisabPwa.isStandalone = true;
        notifyChanged();
      });

      try {
        var standaloneMq = window.matchMedia("(display-mode: standalone)");
        var onDisplayMode = function () {
          window.hisabPwa.isStandalone = isStandaloneDisplay();
          notifyChanged();
        };
        if (typeof standaloneMq.addEventListener === "function") {
          standaloneMq.addEventListener("change", onDisplayMode);
        } else if (typeof standaloneMq.addListener === "function") {
          standaloneMq.addListener(onDisplayMode);
        }
      } catch (_) {}
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
