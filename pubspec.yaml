name: hisab
description: "Group expense splitting and settle-up app."
publish_to: 'none'
version: 0.7.16+86

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # Navigation
  go_router: ^17.5.0
  back_button_interceptor: ^8.0.4

  # Localization
  easy_localization: ^3.0.7

  # Local storage
  shared_preferences: ^2.3.3
  # Stay on 10.x: 11 drops v9 cipher data unless users first ran a 10.x build.
  flutter_secure_storage: ^10.3.1

  # Backend contract + the backend implementation bound at build time.
  # The public build resolves hisab_cloud to the offline stub in packages/;
  # a cloud build swaps it via dependency_overrides. See docs/SELF_HOSTING.md.
  hisab_backend:
    path: packages/hisab_backend
  hisab_cloud:
    path: packages/hisab_cloud
  safaeh:
    git:
      url: https://github.com/Zyzto/Safaeh.git
      ref: v0.2.0

  # Local database
  powersync: ^2.3.3
  path_provider: ^2.1.2
  path: ^1.9.0
  uuid: ^4.5.1

  # Collections & utilities
  collection: ^1.18.0

  # UI & animations
  flex_color_scheme: ^8.4.0
  flex_color_picker: ^3.4.0
  google_fonts: ^8.2.1
  # Brand marks (Google/GitHub) that must stay crisp at any density.
  flutter_svg: ^2.3.0
  custom_sliding_segmented_control: ^1.8.5
  toastification: ^3.0.3
  fl_chart: ^1.1.1
  flame: ^1.38.0

  # Date & currency
  intl: ^0.20.3

  # Receipt: camera + OCR (Tesseract Android / Vision iOS via MethodChannel)
  camera: ^0.12.0
  image_picker: ^1.0.7
  image_picker_android: ^0.8.13+19
  image_picker_platform_interface: ^2.9.0
  google_mlkit_genai_prompt: ^0.3.1
  flutter_image_compress: ^2.3.0

  # Receipt AI (LangChain.dart – Gemini + OpenAI vision)
  langchain_google: ^0.7.1
  langchain_openai: ^0.8.1+1

  # Logging
  flutter_logging_service:
    git:
      url: https://github.com/Zyzto/siglat.git
      ref: v0.2.2

  # Settings (theme + "Local Only" toggle)
  flutter_settings_framework:
    git:
      url: https://github.com/Zyzto/edadat.git
      ref: v0.7.1

  # About (version, licenses)
  package_info_plus: ^10.2.1

  # App update (version check + Android in-app update)
  upgrader: ^13.7.0
  in_app_update: ^5.0.0
  version: ^3.0.2

  # Backup (file picker for export/import + full zip packages)
  file_picker: ^12.0.0
  archive: ^4.1.0
  langchain_core: ^0.4.1

  # Log handling and telemetry
  http: ^1.2.0
  url_launcher: ^6.2.5
  pretty_qr_code: ^3.6.0
  mobile_scanner: ^7.2.0
  connectivity_plus: ^7.0.0
  app_links: ^7.2.1
  currency_picker: ^2.0.21

  # Push notifications
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0

  # Permissions
  permission_handler: ^13.0.1

  # Interactive feedback with annotated screenshots
  feedback: ^3.2.0
  clipboard: ^3.0.14
  share_plus: ^13.3.0
  web: ^1.1.0
  # OS screenshot detection (iOS + Android 14+); detection only, never prevention
  ss_preventer: ^0.1.2

  # AI-agent E2E (debug only via MarionetteBinding)
  marionette_flutter: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  args: ^2.7.0
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  plugin_platform_interface: ^2.1.8
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8
  flutter_launcher_icons: ^0.14.4
  marionette_mcp: ^0.6.0

# Tracked: langchain_google latest (0.7.1+2) still needs googleai_dart 3.0.0 — ApiException.code renamed in 3.6.
dependency_overrides:
  googleai_dart: 3.0.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true  # App Store rejects icons with alpha
  web:
    generate: true
  image_path: "assets/Hisab.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/Hisab.png"

flutter:
  uses-material-design: true
  assets:
    - assets/Hisab.png
    - assets/translations/
    - assets/icons/
    - assets/images/parallax/
    - assets/tessdata/eng.traineddata
    - assets/tessdata/ara.traineddata
