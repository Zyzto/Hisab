name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  analyze:
    name: Analyze & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test packages

      - name: Analyze
        # Fail on analyzer errors. Warnings/infos remain visible for the lint rollout
        # (empty_catches / unawaited_futures) without blocking PRs on pre-existing noise.
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee analyze_output.txt
          if grep -E 'error •' analyze_output.txt; then
            echo "Analyzer reported errors"
            exit 1
          fi
          exit 0

  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Run unit and widget tests
        run: flutter test

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run security check
        run: bash ./scripts/run_release_checks.sh

  # The check Cal.com's open-core split lacked: prove the public tree still
  # builds on its own. No google-services.json, no dart-defines, only the
  # offline stub — the state a fresh clone is in. Without this the repo can
  # rot into something that only compiles inside the private overlay.
  offline-build:
    name: Offline Build Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Assert the tree carries no backend dependency
        run: bash ./scripts/ci/assert_offline_only.sh

      - name: Build foss APK
        run: flutter build apk --debug --flavor foss

      - name: Build web
        run: flutter build web
