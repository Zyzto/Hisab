name: Release (offline build)

# Ships the FOSS variant: no backend, no Firebase, its own signing key and its
# own application id (com.shenepoy.hisab.foss), so it installs alongside the
# cloud build rather than replacing it.
#
# The cloud build is produced by the private repo and uploaded to the same
# GitHub Release. Nothing here has access to production credentials.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Only the job that publishes the release needs to write.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Static release checks
        run: bash ./scripts/run_release_checks.sh

      - name: Assert the tree carries no backend dependency
        run: bash ./scripts/ci/assert_offline_only.sh

      - name: Flutter pub get
        run: flutter pub get

      - name: Run unit and widget tests
        run: flutter test

  build-foss:
    name: Build FOSS APKs
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Reclaim runner disk
        run: bash ./scripts/ci/free_disk_space.sh

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # A release builds three obfuscated ABIs from cold; the restored Gradle
      # cache is the difference between minutes and tens of minutes.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: android
          add-job-summary: on-failure

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.FOSS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FOSS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FOSS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FOSS_KEY_PASSWORD }}
        run: bash ./scripts/ci/build_android.sh foss

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: foss-apk
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-foss-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-foss-release.apk
            build/app/outputs/flutter-apk/app-x86_64-foss-release.apk

      - name: Upload Dart symbol maps
        uses: actions/upload-artifact@v7
        with:
          name: foss-symbols
          path: build/app/outputs/symbols/

  github-release:
    name: GitHub Release
    needs: build-foss
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v8
        with:
          name: foss-apk

      # Created as a draft so the private pipeline can attach the cloud build
      # before anyone sees a release that offers only one of the two.
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            app-armeabi-v7a-foss-release.apk
            app-arm64-v8a-foss-release.apk
            app-x86_64-foss-release.apk
