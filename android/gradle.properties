org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# CI restores ~/.gradle between runs, so the build cache turns a cold Android
# build into a mostly incremental one. Locally it does the same across
# flutter clean.
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
# The foss flavor ships no google-services.json on purpose. Without this the
# plugin fails that variant whenever the cloud flavor supplies one.
android.googleServices.missingGoogleServicesStrategy=IGNORE
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
