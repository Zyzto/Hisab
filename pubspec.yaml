name: hisab
description: "Group expense splitting and settle-up app."
publish_to: 'none'
version: 0.7.1+71

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.0.0
  back_button_interceptor: ^8.0.4

  # Localization
  easy_localization: ^3.0.7

  # Local storage
  shared_preferences: ^2.3.3

  # Backend & database
  supabase_flutter: ^2.8.4
  powersync: ^2.3.3
  path_provider: ^2.1.2
  path: ^1.9.0
  uuid: ^4.5.1

  # Collections & utilities
  collection: ^1.18.0

  # UI & animations
  flex_color_scheme: ^8.4.0
  flex_color_picker: ^3.4.0
  google_fonts: ^8.0.2
  animations: ^2.1.0
  custom_sliding_segmented_control: ^1.8.5
  toastification: ^3.0.3
  fl_chart: ^1.1.1
  flame: ^1.38.0

  # Date & currency
  intl: ^0.20.2

  # Receipt: camera + OCR
  image_picker: ^1.0.7
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.9.0
  google_mlkit_text_recognition: ^0.16.0
  flutter_image_compress: ^2.3.0

  # Receipt AI (LangChain.dart – Gemini + OpenAI vision)
  langchain_google: ^0.7.1
  langchain_openai: ^0.8.1+1

  # Logging
  easy_logger: ^0.0.2
  flutter_logging_service:
    git:
      url: https://github.com/Zyzto/siglat.git
      ref: main

  # Settings (theme + "Local Only" toggle)
  flutter_settings_framework:
    git:
      url: https://github.com/Zyzto/edadat.git
      ref: v0.5.1

  # About (version, licenses)
  package_info_plus: ^9.0.1

  # App update (version check + Android in-app update)
  upgrader: ^13.6.0
  in_app_update: ^4.2.5
  version: ^3.0.2

  # Backup (file picker for export/import + full zip packages)
  file_picker: ^10.3.10
  archive: ^4.0.9
  langchain_core: ^0.4.1

  # Log handling and telemetry
  http: ^1.2.0
  url_launcher: ^6.2.5
  material_symbols_icons: ^4.2906.0
  pretty_qr_code: ^3.6.0
  mobile_scanner: ^7.2.0
  connectivity_plus: ^7.0.0
  app_links: ^7.0.0
  currency_picker: ^2.0.21

  # Push notifications
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^22.2.0

  # Permissions
  permission_handler: ^12.0.1

  # Interactive feedback with annotated screenshots
  feedback: ^3.2.0
  clipboard: ^3.0.14
  share_plus: ^12.0.2
  web: ^1.1.0
  # OS screenshot detection (iOS + Android 14+); detection only, never prevention
  ss_preventer: ^0.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  args: ^2.7.0
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  plugin_platform_interface: ^2.1.8
  supabase: ^2.0.0
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  riverpod_generator: ^4.0.3
  flutter_launcher_icons: ^0.14.4

# langchain_google 0.7.x still expects ApiException.code; googleai_dart 3.6 renamed it.
dependency_overrides:
  googleai_dart: 3.0.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true  # App Store rejects icons with alpha
  web:
    generate: true
  image_path: "assets/Hisab.png"

flutter:
  uses-material-design: true
  assets:
    - assets/Hisab.png
    - assets/translations/
    - assets/images/parallax/
