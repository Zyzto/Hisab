name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo. Jobs that need more say so themselves.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  analyze:
    name: Analyze & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test packages

      - name: Analyze
        # Fail on analyzer errors. Warnings/infos remain visible for the lint rollout
        # (empty_catches / unawaited_futures) without blocking PRs on pre-existing noise.
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee analyze_output.txt
          if grep -E 'error •' analyze_output.txt; then
            echo "Analyzer reported errors"
            exit 1
          fi
          exit 0

  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Run unit and widget tests
        run: flutter test

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run security check
        run: bash ./scripts/run_release_checks.sh

  # The check Cal.com's open-core split lacked: prove the public tree still
  # builds on its own. No google-services.json, no dart-defines, only the
  # offline stub — the state a fresh clone is in. Without this the repo can
  # rot into something that only compiles inside the private overlay.
  #
  # Android and web are separate jobs because the APK takes several times as
  # long, and a web regression should not wait behind it to be reported.
  offline-build:
    name: Offline Build Guard (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Restores ~/.gradle: the dependency cache, the wrapper, and the build
      # cache that gradle.properties enables. Writes a new entry only on main,
      # so pull requests read it without evicting each other's.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: android
          add-job-summary: on-failure

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Assert the tree carries no backend dependency
        run: bash ./scripts/ci/assert_offline_only.sh

      - name: Build foss APK
        run: flutter build apk --debug --flavor foss

  offline-build-web:
    name: Offline Build Guard (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Assert the tree carries no backend dependency
        run: bash ./scripts/ci/assert_offline_only.sh

      # --no-wasm-dry-run: the dry run only reports incompatibilities in
      # packages we do not control, and is not free.
      - name: Build web
        run: flutter build web --no-wasm-dry-run
