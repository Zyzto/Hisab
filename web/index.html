<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0175C2">
  <meta name="description" content="Hisab keeps group expenses, balances, settlements, and receipts on your device.">
  <title>Hisab – Local group expenses</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      min-width: 320px;
      min-height: 500px;
      margin: 0;
      background: #f7f4ef;
      color: #1c1917;
    }
    #hisab-boot-splash {
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 12px;
      text-align: center;
      font-family: system-ui, sans-serif;
      z-index: 9999;
    }
    #hisab-boot-splash .title {
      font-size: 28px;
      font-weight: 700;
    }
    #hisab-boot-splash .subtitle {
      font-size: 14px;
      opacity: .7;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background: #121212;
        color: #f5f5f4;
      }
    }
  </style>
</head>
<body>
  <div id="hisab-boot-splash" aria-live="polite">
    <div class="title">Hisab</div>
    <div class="subtitle">Local expenses, private by default</div>
  </div>

  <script>
    (function () {
      var deferredPrompt = null;
      var listeners = [];
      function standalone() {
        try {
          return window.matchMedia('(display-mode: standalone)').matches ||
            window.matchMedia('(display-mode: fullscreen)').matches ||
            window.matchMedia('(display-mode: minimal-ui)').matches;
        } catch (_) {
          return false;
        }
      }
      function changed() {
        if (typeof window.hisabPwa !== 'undefined' &&
            typeof window.hisabPwa.onChanged === 'function') {
          try { window.hisabPwa.onChanged(); } catch (_) {}
        }
        listeners.slice().forEach(function (listener) {
          try { listener(); } catch (_) {}
        });
      }
      window.hisabPwa = {
        canPrompt: false,
        isStandalone: standalone(),
        onChanged: null,
        promptInstall: function () {
          if (!deferredPrompt) return Promise.resolve(false);
          var event = deferredPrompt;
          deferredPrompt = null;
          this.canPrompt = false;
          changed();
          return event.prompt().then(function () {
            return event.userChoice;
          }).then(function (choice) {
            return !!choice && choice.outcome === 'accepted';
          }).catch(function () { return false; });
        }
      };
      window.hisabPwa.onChanged = function () { changed(); };
      window.hisabPwa.addListener = function (listener) {
        listeners.push(listener);
      };
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        deferredPrompt = event;
        window.hisabPwa.canPrompt = true;
        changed();
      });
      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        window.hisabPwa.canPrompt = false;
        window.hisabPwa.isStandalone = true;
        changed();
      });
      window.addEventListener('flutter-first-frame', function () {
        var splash = document.getElementById('hisab-boot-splash');
        if (splash) splash.remove();
      });
      window.setTimeout(function () {
        var splash = document.getElementById('hisab-boot-splash');
        if (splash) splash.remove();
      }, 15000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
